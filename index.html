<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Birthday Cake</title>

    <!-- Cấu hình Màu sắc & Thanh trạng thái cho Safari / iOS / PWA -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1a0b1f">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="color-scheme" content="dark">

    <!-- Preload Assets quan trọng để render tức thì ở lần truy cập đầu -->
    <link rel="preload" href="assets/image/cake_birthday.svg" as="image">
    <link rel="preload" href="assets/image/Bunting_Garland.svg" as="image">
    <link rel="preload" href="assets/image/Matchstick.svg" as="image">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Scene 1: Màn hình Intro -->
    <div id="scene-intro">
        <button id="btn-start" onclick="goToCakeScene()">Bắt đầu</button>
    </div>

    <!-- Scene 2: Màn hình Bánh Sinh Nhật -->
    <div id="scene-cake">
        <div class="cake-container">
            <img src="assets/image/cake_birthday.svg" alt="Birthday Cake" class="cake-img">
            
            <!-- Hiệu ứng ngọn nến -->
            <div class="cake-glow"></div>
            <div class="flame"></div>
            <div class="smoke"></div>

            <!-- Vòng Progress Ring SVG -->
            <svg class="progress-ring" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45"></circle>
            </svg>
        </div>
    </div>

    <!-- File âm thanh -->
    <audio id="bg-music-intro" src="assets/audio/intro.mp3" loop></audio>
    <audio id="sfx-blow" src="assets/audio/blow.mp3"></audio>

    <script src="app.js"></script>
</body>
</html>
